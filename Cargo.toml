[package]
name = "gpu-tune"
version = "0.5.0"
edition = "2024"
description = "Automatic overclock / undervolt finder for NVIDIA GPUs on Linux, tested with Vulkan loads like games"
license = "MIT"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
libc = "0.2.190"
libloading = "0.9.0"
pollster = "1.0.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
# Vulkan only: the whole point is that test loads run like games (P0), not like CUDA (P2).
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
